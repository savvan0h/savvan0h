<circle cx="170" cy="157.08333333333331" r="4" fill="#ffffff" />
<circle cx="260" cy="130.83333333333331" r="4" fill="#ffffff" />
<circle cx="350" cy="215.41666666666666" r="4" fill="#ffffff" />
<circle cx="440" cy="145.41666666666669" r="4" fill="#ffffff" />
<circle cx="530" cy="154.16666666666669" r="4" fill="#ffffff" />
<circle cx="620" cy="186.25" r="4" fill="#ffffff" />

