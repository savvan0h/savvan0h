<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#000000" />

  <!-- Title & Date Range -->
  <text x="20" y="40" font-size="22" fill="#ffffff" font-family="Arial, sans-serif">
    Sleep Score
  </text>
  <text x="20" y="70" font-size="18" fill="#cccccc" font-family="Arial, sans-serif">
    2026-11-15 → 2026-11-20
  </text>

  <!-- Chart Area -->
  <!-- Y-axis line -->
  <line x1="80" y1="90" x2="80" y2="230" stroke="#444444" stroke-width="1"/>
  <!-- X-axis line -->
  <line x1="80" y1="230" x2="620" y2="230" stroke="#444444" stroke-width="1"/>

  <!-- Dotted Threshold Lines & Labels -->
  <g id="extra-lines">
    
        <line x1="80" y1="193.33333333333331" x2="620" y2="193.33333333333331"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="197.33333333333331" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          60 (Fair)
        </text>
      
        <line x1="80" y1="160" x2="620" y2="160"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="164" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          70 (Good)
        </text>
      
        <line x1="80" y1="110" x2="620" y2="110"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="114" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          85 (Optimal)
        </text>
      
  </g>

  <!-- Main Line Chart Path -->
  <path d="M 80,146.66666666666669 L 188,180 L 296,150 L 404,186.66666666666666 L 512,213.33333333333334 L 620,106.66666666666667" fill="none" stroke="#6B8EFF" stroke-width="2"/>

  <!-- Data Points -->
  <g fill="#ffffff">
    <circle cx="80" cy="146.66666666666669" r="4" fill="#ffffff" />
<circle cx="188" cy="180" r="4" fill="#ffffff" />
<circle cx="296" cy="150" r="4" fill="#ffffff" />
<circle cx="404" cy="186.66666666666666" r="4" fill="#ffffff" />
<circle cx="512" cy="213.33333333333334" r="4" fill="#ffffff" />
<circle cx="620" cy="106.66666666666667" r="4" fill="#ffffff" />

  </g>

  <!-- X-axis Tick Labels -->
  <g class="x-ticks">
    
      <text x="80" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-15
      </text>
    
      <text x="188" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-16
      </text>
    
      <text x="296" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-17
      </text>
    
      <text x="404" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-18
      </text>
    
      <text x="512" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-19
      </text>
    
      <text x="620" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        11-20
      </text>
    
  </g>

  <!-- Y-axis Tick Labels -->
  <g class="y-ticks">
    
      <text x="70" y="234" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        49
      </text>
    
      <text x="70" y="206" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        57
      </text>
    
      <text x="70" y="178" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        66
      </text>
    
      <text x="70" y="150" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        74
      </text>
    
      <text x="70" y="122" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        83
      </text>
    
      <text x="70" y="94" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        91
      </text>
    
  </g>
</svg>
