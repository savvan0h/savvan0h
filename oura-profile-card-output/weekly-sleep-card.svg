<circle cx="188" cy="166.60377358490567" r="4" fill="#ffffff" />
<circle cx="296" cy="132.26415094339623" r="4" fill="#ffffff" />
<circle cx="404" cy="216.79245283018867" r="4" fill="#ffffff" />
