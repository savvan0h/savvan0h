        <text x="630" y="179.09803921568627" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          60 (Fair)
        </text>
      
        <line x1="80" y1="147.6470588235294" x2="620" y2="147.6470588235294"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="151.6470588235294" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          70 (Good)
        </text>
      
        <line x1="80" y1="106.47058823529412" x2="620" y2="106.47058823529412"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="110.47058823529412" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          85 (Optimal)
        </text>
      
  </g>

  <!-- Main Line Chart Path -->
  <path d="M 80,169.6078431372549 L 170,191.5686274509804 L 260,103.72549019607843 L 350,194.31372549019608 L 440,114.70588235294119 L 530,150.39215686274508 L 620,216.27450980392157" fill="none" stroke="#6B8EFF" stroke-width="2"/>

  <!-- Data Points -->
  <g fill="#ffffff">
    <circle cx="80" cy="169.6078431372549" r="4" fill="#ffffff" />
<circle cx="170" cy="191.5686274509804" r="4" fill="#ffffff" />
<circle cx="260" cy="103.72549019607843" r="4" fill="#ffffff" />
<circle cx="350" cy="194.31372549019608" r="4" fill="#ffffff" />
<circle cx="440" cy="114.70588235294119" r="4" fill="#ffffff" />
<circle cx="530" cy="150.39215686274508" r="4" fill="#ffffff" />
<circle cx="620" cy="216.27450980392157" r="4" fill="#ffffff" />

