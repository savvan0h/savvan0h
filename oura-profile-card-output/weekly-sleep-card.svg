  <path d="M 80,103.20754716981132 L 188,166.60377358490567 L 296,132.26415094339623 L 404,216.79245283018867 L 512,111.1320754716981 L 620,190.37735849056605" fill="none" stroke="#6B8EFF" stroke-width="2"/>

