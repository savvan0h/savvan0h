<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#000000" />

  <!-- Title & Date Range -->
  <text x="20" y="40" font-size="22" fill="#ffffff" font-family="Arial, sans-serif">
    Sleep Score
  </text>
  <text x="20" y="70" font-size="18" fill="#cccccc" font-family="Arial, sans-serif">
    2026-10-25 → 2026-10-31
  </text>

  <!-- Chart Area -->
  <!-- Y-axis line -->
  <line x1="80" y1="90" x2="80" y2="230" stroke="#444444" stroke-width="1"/>
  <!-- X-axis line -->
  <line x1="80" y1="230" x2="620" y2="230" stroke="#444444" stroke-width="1"/>

  <!-- Dotted Threshold Lines & Labels -->
  <g id="extra-lines">
    
        <line x1="80" y1="178.66666666666669" x2="620" y2="178.66666666666669"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="182.66666666666669" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          60 (Fair)
        </text>
      
        <line x1="80" y1="155.33333333333331" x2="620" y2="155.33333333333331"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="159.33333333333331" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          70 (Good)
        </text>
      
        <line x1="80" y1="120.33333333333333" x2="620" y2="120.33333333333333"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="124.33333333333333" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          85 (Optimal)
        </text>
      
  </g>

  <!-- Main Line Chart Path -->
  <path d="M 80,171.66666666666666 L 170,141.33333333333334 L 260,216 L 350,122.66666666666666 L 440,192.66666666666666 L 530,101.66666666666669 L 620,218.33333333333334" fill="none" stroke="#6B8EFF" stroke-width="2"/>

  <!-- Data Points -->
  <g fill="#ffffff">
    <circle cx="80" cy="171.66666666666666" r="4" fill="#ffffff" />
<circle cx="170" cy="141.33333333333334" r="4" fill="#ffffff" />
<circle cx="260" cy="216" r="4" fill="#ffffff" />
<circle cx="350" cy="122.66666666666666" r="4" fill="#ffffff" />
<circle cx="440" cy="192.66666666666666" r="4" fill="#ffffff" />
<circle cx="530" cy="101.66666666666669" r="4" fill="#ffffff" />
<circle cx="620" cy="218.33333333333334" r="4" fill="#ffffff" />

  </g>

  <!-- X-axis Tick Labels -->
  <g class="x-ticks">
    
      <text x="80" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-25
      </text>
    
      <text x="170" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-26
      </text>
    
      <text x="260" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-27
      </text>
    
      <text x="350" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-28
      </text>
    
      <text x="440" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-29
      </text>
    
      <text x="530" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-30
      </text>
    
      <text x="620" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-31
      </text>
    
  </g>

  <!-- Y-axis Tick Labels -->
  <g class="y-ticks">
    
      <text x="70" y="234" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        38
      </text>
    
      <text x="70" y="206" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        50
      </text>
    
      <text x="70" y="178" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        62
      </text>
    
      <text x="70" y="150" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        74
      </text>
    
      <text x="70" y="122" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        86
      </text>
    
      <text x="70" y="94" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        98
      </text>
    
  </g>
</svg>
