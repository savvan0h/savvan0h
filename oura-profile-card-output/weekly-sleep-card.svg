<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <!-- Background -->
  <rect x="0" y="0" width="720" height="320" fill="#000000" />

  <!-- Title & Date Range -->
  <text x="20" y="40" font-size="22" fill="#ffffff" font-family="Arial, sans-serif">
    Sleep Score
  </text>
  <text x="20" y="70" font-size="18" fill="#cccccc" font-family="Arial, sans-serif">
    2026-10-23 → 2026-10-29
  </text>

  <!-- Chart Area -->
  <!-- Y-axis line -->
  <line x1="80" y1="90" x2="80" y2="230" stroke="#444444" stroke-width="1"/>
  <!-- X-axis line -->
  <line x1="80" y1="230" x2="620" y2="230" stroke="#444444" stroke-width="1"/>

  <!-- Dotted Threshold Lines & Labels -->
  <g id="extra-lines">
    
        <line x1="80" y1="161.11111111111111" x2="620" y2="161.11111111111111"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="165.11111111111111" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          60 (Fair)
        </text>
      
        <line x1="80" y1="138.88888888888889" x2="620" y2="138.88888888888889"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="142.88888888888889" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          70 (Good)
        </text>
      
        <line x1="80" y1="105.55555555555556" x2="620" y2="105.55555555555556"
              stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" />
        <text x="630" y="109.55555555555556" text-anchor="start"
              font-size="12" fill="#bbbbbb" font-family="Arial, sans-serif">
          85 (Optimal)
        </text>
      
  </g>

  <!-- Main Line Chart Path -->
  <path d="M 80,145.55555555555554 L 170,101.11111111111111 L 260,154.44444444444446 L 350,125.55555555555556 L 440,196.66666666666669 L 530,107.77777777777777 L 620,218.88888888888889" fill="none" stroke="#6B8EFF" stroke-width="2"/>

  <!-- Data Points -->
  <g fill="#ffffff">
    <circle cx="80" cy="145.55555555555554" r="4" fill="#ffffff" />
<circle cx="170" cy="101.11111111111111" r="4" fill="#ffffff" />
<circle cx="260" cy="154.44444444444446" r="4" fill="#ffffff" />
<circle cx="350" cy="125.55555555555556" r="4" fill="#ffffff" />
<circle cx="440" cy="196.66666666666669" r="4" fill="#ffffff" />
<circle cx="530" cy="107.77777777777777" r="4" fill="#ffffff" />
<circle cx="620" cy="218.88888888888889" r="4" fill="#ffffff" />

  </g>

  <!-- X-axis Tick Labels -->
  <g class="x-ticks">
    
      <text x="80" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-23
      </text>
    
      <text x="170" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-24
      </text>
    
      <text x="260" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-25
      </text>
    
      <text x="350" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-26
      </text>
    
      <text x="440" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-27
      </text>
    
      <text x="530" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-28
      </text>
    
      <text x="620" y="245" text-anchor="middle"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        10-29
      </text>
    
  </g>

  <!-- Y-axis Tick Labels -->
  <g class="y-ticks">
    
      <text x="70" y="234" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        29
      </text>
    
      <text x="70" y="206" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        42
      </text>
    
      <text x="70" y="178" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        54
      </text>
    
      <text x="70" y="150" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        67
      </text>
    
      <text x="70" y="122" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        79
      </text>
    
      <text x="70" y="94" text-anchor="end"
            font-size="12" fill="#ffffff" font-family="Arial, sans-serif">
        92
      </text>
    
  </g>
</svg>
